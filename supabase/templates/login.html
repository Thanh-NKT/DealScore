<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Đăng nhập Kairo</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #111; max-width: 500px; margin: 0 auto; padding: 24px;">
  <h2 style="margin-bottom: 16px;">Đăng nhập Kairo</h2>
  <p>Bạn đã yêu cầu đăng nhập vào Kairo. Bấm nút bên dưới để đăng nhập ngay:</p>
  
  <p style="margin: 24px 0;">
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display: inline-block; background-color: #111; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600;">Đăng nhập Kairo</a>
  </p>

  <p>Hoặc nhập mã xác nhận 6 số sau trên trang đăng nhập:</p>
  <p style="font-size: 28px; font-weight: 700; letter-spacing: 4px; margin: 16px 0; color: #d97706;">
    {{ .Token }}
  </p>

  <hr style="border: none; border-top: 1px solid #e5e5e5; margin: 24px 0;" />
  <p style="font-size: 13px; color: #666;">
    Link và mã hết hạn sau 60 phút và chỉ dùng được một lần.<br />
    Nếu bạn không yêu cầu đăng nhập, hãy bỏ qua email này.
  </p>
</body>
</html>
