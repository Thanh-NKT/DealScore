<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Xác nhận email DealScore</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #111; max-width: 500px; margin: 0 auto; padding: 24px;">
  <h2 style="margin-bottom: 16px;">Xác nhận email DealScore</h2>
  <p>Cảm ơn bạn đã đăng ký DealScore. Bấm nút bên dưới để xác nhận email và bắt đầu theo dõi giá:</p>

  <p style="margin: 24px 0;">
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display: inline-block; background-color: #111; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600;">Xác nhận email</a>
  </p>

  <hr style="border: none; border-top: 1px solid #e5e5e5; margin: 24px 0;" />
  <p style="font-size: 13px; color: #666;">
    Link hết hạn sau 60 phút và chỉ dùng được một lần.<br />
    Nếu không phải bạn yêu cầu, hãy bỏ qua email này.
  </p>
</body>
</html>
